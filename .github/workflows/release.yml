name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-arm64:
    name: Build arm64 (Apple Silicon)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          brew install libusb pkg-config node

      - name: Run tests
        run: go test -race ./...

      - name: Build arm64 Go binary
        run: |
          set -ex
          echo "=== Step 1: Create build dir ==="
          mkdir -p build
          echo "=== Step 2: Build main binary ==="
          GOARCH=arm64 GOOS=darwin CGO_ENABLED=1 \
            go build -v -ldflags="-X main.version=${{ github.ref_name }}" \
            -o build/bettertether ./cmd/bettertether
          echo "=== Step 3: Build uninstall binary ==="
          GOARCH=arm64 GOOS=darwin CGO_ENABLED=0 \
            go build -v -o build/bettertether-uninstall ./cmd/bettertether-uninstall
          echo "=== Step 4: Verify build output ==="
          ls -la build/
          file build/bettertether
          file build/bettertether-uninstall

      - name: Package arm64 tarball
        run: |
          echo "=== Debug: pwd ===" && pwd
          echo "=== Debug: ls build/ ===" && ls -la build/
          cp build/bettertether build/bettertether-darwin-arm64
          tar czf build/bettertether-darwin-arm64.tar.gz -C build bettertether-darwin-arm64
          rm -f build/bettertether-darwin-arm64
          shasum -a 256 build/bettertether-darwin-arm64.tar.gz > build/bettertether-darwin-arm64.tar.gz.sha256
          echo "=== Debug: ls build/ after ===" && ls -la build/

      - name: Build arm64 DMG
        run: |
          mkdir -p gui/resources
          cp build/bettertether gui/resources/bettertether
          cp build/bettertether-uninstall gui/resources/bettertether-uninstall
          cp launchd/com.s4wbvnny.bettertether.plist gui/resources/com.s4wbvnny.bettertether.plist
          cp config/default.toml gui/resources/default.toml
          cd gui
          npm install
          npm run build
          npx electron-builder --publish never --mac dmg --arm64

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-builds
          path: |
            gui/dist/BetterTether-*-arm64.dmg
            build/bettertether-darwin-arm64.tar.gz
            build/bettertether-darwin-arm64.tar.gz.sha256

  release-x64:
    name: Build x64 (Intel)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          brew install pkg-config node

      - name: Build x86_64 libusb from source
        run: |
          curl -sL https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2 | tar xj
          cd libusb-1.0.30
          ./configure --host=x86_64-apple-darwin CC="clang -arch x86_64" --prefix=$HOME/libusb-x64
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Run tests
        run: go test -race ./...

      - name: Build x64 Go binary
        run: |
          set -ex
          echo "=== Step 1: Create build dir ==="
          mkdir -p build
          echo "=== Step 2: Build main binary ==="
          CC="clang -arch x86_64" \
            CGO_CFLAGS="-I$HOME/libusb-x64/include/libusb-1.0" \
            CGO_LDFLAGS="-L$HOME/libusb-x64/lib -lusb-1.0" \
            GOARCH=amd64 GOOS=darwin CGO_ENABLED=1 \
            go build -v -ldflags="-X main.version=${{ github.ref_name }}" \
            -o build/bettertether ./cmd/bettertether
          echo "=== Step 3: Build uninstall binary ==="
          GOARCH=amd64 GOOS=darwin CGO_ENABLED=0 \
            go build -v -o build/bettertether-uninstall ./cmd/bettertether-uninstall
          echo "=== Step 4: Verify build output ==="
          ls -la build/
          file build/bettertether
          file build/bettertether-uninstall
          echo "=== Step 5: Point libusb dep at standard Intel Homebrew path ==="
          otool -L build/bettertether | grep -i libusb
          install_name_tool -change \
            "$HOME/libusb-x64/lib/libusb-1.0.0.dylib" \
            /usr/local/opt/libusb/lib/libusb-1.0.0.dylib \
            build/bettertether
          otool -L build/bettertether | grep -i libusb

      - name: Package x64 tarball
        run: |
          echo "=== Debug: listing build dir ==="
          ls -la build/
          echo "=== Debug: pwd ==="
          pwd
          cp build/bettertether build/bettertether-darwin-x64
          tar czf build/bettertether-darwin-x64.tar.gz -C build bettertether-darwin-x64
          rm -f build/bettertether-darwin-x64
          shasum -a 256 build/bettertether-darwin-x64.tar.gz > build/bettertether-darwin-x64.tar.gz.sha256

      - name: Build x64 DMG
        run: |
          mkdir -p gui/resources
          cp build/bettertether gui/resources/bettertether
          cp build/bettertether-uninstall gui/resources/bettertether-uninstall
          cp launchd/com.s4wbvnny.bettertether.plist gui/resources/com.s4wbvnny.bettertether.plist
          cp config/default.toml gui/resources/default.toml
          cd gui
          npm install
          npm run build
          npx electron-builder --publish never --mac dmg --x64

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x64-builds
          path: |
            gui/dist/BetterTether-*-x64.dmg
            build/bettertether-darwin-x64.tar.gz
            build/bettertether-darwin-x64.tar.gz.sha256

  release:
    name: Create Release
    needs: [release-arm64, release-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 builds
        uses: actions/download-artifact@v4
        with:
          name: arm64-builds
          path: dist

      - name: Download x64 builds
        uses: actions/download-artifact@v4
        with:
          name: x64-builds
          path: dist

      - name: Restructure dist for release
        run: |
          set -e
          mkdir -p release
          find dist -type f \( \
            -name 'BetterTether-*-arm64.dmg' -o \
            -name 'BetterTether-*-x64.dmg' -o \
            -name 'bettertether-darwin-*.tar.gz' -o \
            -name 'bettertether-darwin-*.tar.gz.sha256' \
          \) -exec mv {} release/ \;
          echo "=== Files staged for release ==="
          ls -la release/
          git archive --format=zip -o release/BetterTether-${{ github.ref_name }}.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BetterTether-*.zip
            release/bettertether-darwin-arm64.tar.gz
            release/bettertether-darwin-arm64.tar.gz.sha256
            release/bettertether-darwin-x64.tar.gz
            release/bettertether-darwin-x64.tar.gz.sha256
            release/BetterTether-*-arm64.dmg
            release/BetterTether-*-x64.dmg
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Updating tap to ${VERSION}"

          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN secret not set — skipping tap update. Add a PAT with repo access to secrets.TAP_TOKEN"
            exit 0
          fi

          # Download DMGs from the release we just created
          curl -sL -o /tmp/arm64.dmg \
            "https://github.com/s4wbvnny/BetterTether/releases/download/${TAG}/BetterTether-${VERSION}-arm64.dmg"
          curl -sL -o /tmp/x64.dmg \
            "https://github.com/s4wbvnny/BetterTether/releases/download/${TAG}/BetterTether-${VERSION}-x64.dmg"

          ARM64_SHA=$(shasum -a 256 /tmp/arm64.dmg | awk '{print $1}')
          X64_SHA=$(shasum -a 256 /tmp/x64.dmg | awk '{print $1}')
          echo "arm64 sha256: ${ARM64_SHA}"
          echo "x64 sha256: ${X64_SHA}"

          # Clone the tap repo
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/s4wbvnny/homebrew-tap.git" /tmp/tap

          cat > /tmp/tap/Casks/bettertether.rb <<RUBY
          cask "bettertether" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM64_SHA}"
              url "https://github.com/s4wbvnny/BetterTether/releases/download/${TAG}/BetterTether-${VERSION}-arm64.dmg"
            end
            on_intel do
              sha256 "${X64_SHA}"
              url "https://github.com/s4wbvnny/BetterTether/releases/download/${TAG}/BetterTether-${VERSION}-x64.dmg"
            end

            name "BetterTether"
            desc "USB tethering manager for macOS"
            homepage "https://github.com/s4wbvnny/BetterTether"

            app "BetterTether.app"

            uninstall quit: "com.s4wbvnny.bettertether-ui"
          end
          RUBY

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bettertether.rb
          git diff --cached --quiet && echo "No changes to cask" && exit 0
          git commit -m "Update BetterTether to ${VERSION}"
          git push
