name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-arm64:
    name: Build arm64 (Apple Silicon)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          brew install libusb pkg-config node

      - name: Run tests
        run: go test -race ./...

      - name: Build arm64 Go binary
        run: |
          GOARCH=arm64 GOOS=darwin CGO_ENABLED=1 \
            go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o build/bettertether ./cmd/bettertether
          GOARCH=arm64 GOOS=darwin CGO_ENABLED=0 \
            go build -o build/bettertether-uninstall ./cmd/bettertether-uninstall

      - name: Build arm64 DMG
        run: |
          mkdir -p gui/resources
          cp build/bettertether gui/resources/bettertether
          cp build/bettertether-uninstall gui/resources/bettertether-uninstall
          cp launchd/com.s4wbvnny.bettertether.plist gui/resources/com.s4wbvnny.bettertether.plist
          cp config/default.toml gui/resources/default.toml
          cd gui
          npm install
          npm run build
          npx electron-builder --publish never --mac dmg --arm64

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-dmg
          path: gui/dist/BetterTether-*-arm64.dmg

  release-x64:
    name: Build x64 (Intel)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          brew install pkg-config node

      - name: Build x86_64 libusb from source
        run: |
          curl -sL https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2 | tar xj
          cd libusb-1.0.30
          ./configure --host=x86_64-apple-darwin CC="clang -arch x86_64" --prefix=$HOME/libusb-x64
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Run tests
        run: go test -race ./...

      - name: Build x64 Go binary
        run: |
          CC="clang -arch x86_64" \
            CGO_CFLAGS="-I$HOME/libusb-x64/include/libusb-1.0" \
            CGO_LDFLAGS="-L$HOME/libusb-x64/lib -lusb-1.0" \
            GOARCH=amd64 GOOS=darwin CGO_ENABLED=1 \
            go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o build/bettertether ./cmd/bettertether
          GOARCH=amd64 GOOS=darwin CGO_ENABLED=0 \
            go build -o build/bettertether-uninstall ./cmd/bettertether-uninstall

      - name: Build x64 DMG
        run: |
          mkdir -p gui/resources
          cp build/bettertether gui/resources/bettertether
          cp build/bettertether-uninstall gui/resources/bettertether-uninstall
          cp launchd/com.s4wbvnny.bettertether.plist gui/resources/com.s4wbvnny.bettertether.plist
          cp config/default.toml gui/resources/default.toml
          cd gui
          npm install
          npm run build
          npx electron-builder --publish never --mac dmg --x64

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x64-dmg
          path: gui/dist/BetterTether-*-x64.dmg

  release:
    name: Create Release
    needs: [release-arm64, release-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: arm64-dmg
          path: gui/dist

      - name: Download x64 DMG
        uses: actions/download-artifact@v4
        with:
          name: x64-dmg
          path: gui/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Package signed binary tarball (arm64)
        run: |
          mkdir -p build
          GOARCH=arm64 GOOS=darwin CGO_ENABLED=0 \
            go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o build/bettertether ./cmd/bettertether
          cd build && cp bettertether bettertether-darwin-arm64 && \
            tar czf bettertether-darwin-arm64.tar.gz bettertether-darwin-arm64
          rm -f bettertether-darwin-arm64
          shasum -a 256 bettertether-darwin-arm64.tar.gz > bettertether-darwin-arm64.tar.gz.sha256

      - name: Package signed binary tarball (x64)
        run: |
          GOARCH=amd64 GOOS=darwin CGO_ENABLED=0 \
            go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o build/bettertether-x64 ./cmd/bettertether
          cd build && cp bettertether-x64 bettertether-darwin-x64 && \
            tar czf bettertether-darwin-x64.tar.gz bettertether-darwin-x64
          rm -f bettertether-darwin-x64 bettertether-x64
          shasum -a 256 bettertether-darwin-x64.tar.gz > bettertether-darwin-x64.tar.gz.sha256

      - name: Archive source code
        run: |
          git archive --format=zip -o build/BetterTether-${{ github.ref_name }}.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/BetterTether-*.zip
            build/bettertether-darwin-arm64.tar.gz
            build/bettertether-darwin-arm64.tar.gz.sha256
            build/bettertether-darwin-x64.tar.gz
            build/bettertether-darwin-x64.tar.gz.sha256
            gui/dist/BetterTether-*-arm64.dmg
            gui/dist/BetterTether-*-x64.dmg
          generate_release_notes: true
