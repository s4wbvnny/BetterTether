name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-14  # Apple Silicon runner (M1)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies (libusb + pkg-config)
        run: brew install libusb pkg-config

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build
        env:
          CGO_ENABLED: 1
          GOARCH: arm64
          GOOS: darwin

      - name: Version consistency
        run: ./scripts/check-version.sh

      - name: Update installer test
        run: ./scripts/test-update-install.sh

  gui:
    name: GUI
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: cd gui && npm ci --no-audit --no-fund

      - name: Typecheck
        run: cd gui && npx tsc --noEmit

      - name: Build
        run: cd gui && npm run build

      - name: Test
        run: cd gui && npm test -- --passWithNoTests