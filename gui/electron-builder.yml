appId: com.s4wbvnny.bettertether-ui
productName: BetterTether
copyright: Copyright © 2025 BetterTether Contributors

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

extraResources:
  - from: resources/bettertether
    to: bettertether
    filter:
      - "**/*"
  - from: resources/bettertether-uninstall
    to: bettertether-uninstall
    filter:
      - "**/*"
  - from: resources/com.s4wbvnny.bettertether.plist
    to: com.s4wbvnny.bettertether.plist
  - from: resources/default.toml
    to: default.toml
  - from: resources/icon.icns
    to: icon.icns
  - from: resources/tray-icon.png
    to: tray-icon.png
  - from: resources/tray
    to: tray

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-categories.utilities
  identity: null
  hardenedRuntime: false
  artifactName: BetterTether-${version}-${arch}.${ext}

afterSign: scripts/after-sign.js

dmg:
  icon: resources/icon.icns
  iconSize: 128
  contents:
    - x: 180
      y: 180
    - x: 440
      y: 180
      type: link
      path: /Applications


