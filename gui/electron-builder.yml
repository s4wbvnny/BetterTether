appId: com.s4wbvnny.bettertether-ui
productName: BetterTether
copyright: Copyright © 2025 BetterTether Contributors

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

extraResources:
  - from: resources/bettertether
    to: bettertether
    filter:
      - "**/*"
  - from: resources/bettertether-uninstall
    to: bettertether-uninstall
    filter:
      - "**/*"
  - from: resources/com.s4wbvnny.bettertether.plist
    to: com.s4wbvnny.bettertether.plist
  - from: resources/update-install.sh
    to: update-install.sh
  - from: resources/default.toml
    to: default.toml
  - from: resources/icon.icns
    to: icon.icns
  - from: resources/tray-icon.png
    to: tray-icon.png
  - from: resources/tray
    to: tray

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-categories.utilities
  identity: null
  hardenedRuntime: false
  artifactName: BetterTether-${version}-${arch}.${ext}

afterSign: scripts/after-sign.js

dmg:
  icon: resources/icon.icns
  iconSize: 128
  # Background and icon positions are a matched pair: the arrow is drawn at the
  # centre of the window (x=270) by scripts/gen-dmg-background, so the two icons
  # must stay symmetric about it (130 and 410). Regenerate the images with
  # `go run ./scripts/gen-dmg-background` if either side changes.
  background: resources/dmg-background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications


