# BetterTether — Default Configuration
# File: /opt/homebrew/etc/bettertether/bettertether.toml
# Docs: https://github.com/s4wbvnny/bettertether
#
# This file is a set of overrides. Anything you leave out keeps the built-in
# default, so you only need to include the settings you actually change.

[usb]
# How often to poll for new USB devices (milliseconds)
poll_interval_ms = 500

# Timeout when claiming USB interface (milliseconds)
claim_timeout_ms = 2000


[rndis]
# Max transfer size negotiated with device (bytes)
# Android phones typically cap at 16384
max_transfer_size = 16384

# Timeout for RNDIS control message responses (milliseconds)
init_timeout_ms = 3000
query_timeout_ms = 2000
set_timeout_ms = 2000

# Read buffer size for bulk IN endpoint (bytes)
read_buffer_size = 65536


[tun]
# The interface name is assigned by the kernel when the utun socket is created;
# macOS will hand out utunN (for example utun6), and that name cannot be chosen.
# Check it with: ifconfig | grep utun

# MTU for the utun interface.
# 1400 leaves room for the RNDIS and USB framing overhead. If large transfers
# hang while small requests work, lower this (1380 is a common working value):
#   sudo ifconfig utun6 mtu 1380
mtu = 1400


[dhcp]
# Timeout for entire DORA sequence (milliseconds)
timeout_ms = 5000

# How many times to retry DORA before giving up
retry_count = 3

# Delay between retries (milliseconds)
retry_delay_ms = 1000


[route]
# Set this interface as default route when tethered
# Set to false if you only want the interface up without rerouting all traffic
set_default_route = true

# Metric for the injected default route (lower = preferred)
route_metric = 100


[api]
# Local HTTP API server for the GUI
enabled = true
host = "127.0.0.1"
port = 9400


[logging]
# Log level: debug | info | warn | error
level = "info"

# Log format: text (human-readable) | json (machine-readable)
format = "text"

# The log destination is set by the LaunchDaemon plist (StandardOutPath), which
# writes /var/log/bettertether.log. Set logging to "text" to keep that file
# readable; "json" is meant for machine consumption.
